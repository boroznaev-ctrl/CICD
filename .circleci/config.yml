version: 2.1
orbs:
  salesforce: circleci/salesforce-sfdx@3.0.3
jobs:
  build_and_test: # this can be any name you choose
    executor: salesforce/default # use the default executor defined within the orb
    steps:
      - checkout # checkout source code
      - salesforce/install:
        version: "2.153.0" 
      - run:
          name: Log in
          command: . build/login_to_sandbox.sh
workflows:
  build_test_deploy:
    jobs:
      - build_and_test