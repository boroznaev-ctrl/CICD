version: 2.1

orbs:
  salesforce: circleci/salesforce-sfdx@2.153 

jobs:
    run-tests:
      docker:
        - image: cimg/base
      steps:
        - checkout
        - salesforce/install     # This ensures the 'sf' CLI binary is installed and mapped
        
        - run:
            name: Install Dependecies
            command: . build/install_dependencies.sh

workflows:
  version: 2.1
  validate:
    jobs:
      - run-tests
